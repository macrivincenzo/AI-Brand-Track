<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- White background circle -->
  <circle cx="100" cy="100" r="95" fill="#ffffff"/>
  <!-- Blue circular outline -->
  <circle cx="100" cy="100" r="85" stroke="url(#blueGradient)" stroke-width="6" fill="none"/>
  <!-- Circular arrow (refresh/cycle) - bottom arc, counter-clockwise -->
  <path d="M 55 125 A 45 45 0 0 1 145 125" stroke="#3B9FD8" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 138 118 L 148 128 L 142 132 Z" fill="#3B9FD8"/>
  <!-- Letter A -->
  <path d="M 78 112 L 92 68 L 106 112" stroke="#0B5394" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 84 98 L 100 98" stroke="#0B5394" stroke-width="5" stroke-linecap="round"/>
  <!-- Magnifying glass -->
  <circle cx="118" cy="72" r="14" stroke="#3B9FD8" stroke-width="5" fill="none"/>
  <path d="M 128 82 L 142 96" stroke="#3B9FD8" stroke-width="5" stroke-linecap="round"/>
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B5394;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B9FD8;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
